name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Backend Tests
        run: |
          cd backend
          npm install
          # npm test # Uncomment when tests are configured
          
      - name: Frontend Build
        run: |
          cd frontend
          npm install
          npm run build
