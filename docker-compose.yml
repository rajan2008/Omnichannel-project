version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:latest
    container_name: infotact_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    networks:
      - infotact_network

  # Redis Service
  redis:
    image: redis:latest
    container_name: infotact_redis
    ports:
      - "6379:6379"
    networks:
      - infotact_network

networks:
  infotact_network:
    driver: bridge

volumes:
  mongodb_data:
